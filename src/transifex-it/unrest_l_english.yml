 situation_planetary_revolt_desc_gestalt_breakaway_gestalt: "Unaligned and deviant elements on [Target.GetName] seek to wrest the world from our grasp."
 situation_planetary_revolt_monthly_change_tooltip: "The more unrest §Y[Target.GetName]§! has, and the more populated the [Target.GetPlanetMoon] is, the faster this §YSituation§! will progress. At advanced stages of the Situation, other colonies and empires may pledge support to the revolt, making it harder to prevent.\n\nWe can slow its progress by increasing £stability£ §YStability§!, decreasing £unemployment£ §YUnemployment§!, placing a garrison of £defense_army£ §YArmies§! on the planet, or strengthening its §YStarbase§!.\n\n§YResettling§! £pop£ Pops away from [Target.GetName] will advance the revolt's progress."
