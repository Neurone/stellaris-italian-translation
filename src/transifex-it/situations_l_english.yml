 situation_living_snow: "Neve insolita"
 situation_living_snow_type: "Neve insolita"
 situation_living_snow_desc: "La neve ha cominciato ad accumularsi fuori da uno dei principali insediamenti coloniali su [Target.GetName], un pianeta desertico dove la neve è un evento decisamente insolito."
 situation_living_snow_monthly_change_tooltip: ""
 situation_snow_hostile: "Scioglila. Tutta."
 situation_snow_observation: ""
 situation_snow_very_hostile_tt: "Sforzi Piromani Eccezionali"
 too_late_to_change_approach: "§RÈ troppo tardi per cambiare gli Approcci all'Evento.§!"
 situation.150.name: "Neve insolita"
 situation.150.desc: "I nostri coloni su [Root.GetName] segnalano uno strano fenomeno: la neve ha cominciato ad accumularsi fuori da uno dei loro principali insediamenti coloniali.\n\nBeh, \"neve\" è il termine che hanno usato per descriverla, comunque. Sembrerebbe poco plausibile che si tratti di vera neve, dato che [Root.GetName] è un pianeta desertico dove le temperature sono raramente sotto lo zero, anche nelle regioni polari. Inoltre, non ci sono stati avvistamenti in cui sia effettivamente caduta dal cielo. Tuttavia, le letture iniziali suggeriscono che la sostanza è costituita principalmente da acqua congelata - anche se non è chiaro perché non si stia sciogliendo. Il nostro [Root.Owner.GetResearchers] è ansioso di indagare le sue proprietà, ma altri avvertono che potrebbe essere pericoloso e vogliono che venga rimosso."
 situation.155.name: "Diffusione dei brividi"
 situation.155.desc: "La neve su [Target.GetName] si è moltiplicata. La piccola chiazza iniziale si è gonfiata fino a coprire un'area sempre più vasta del deserto, al punto che sta interferendo con le nostre reti di trasporto e coltivazione. Se non smette di crescere presto, ci sono crescenti preoccupazioni che la colonia non sarà in grado di continuare a sostenersi da sola.\n\nIl nostro [Owner.GetResearchers] sul pianeta ha cercato, invano, di spiegare il fenomeno. Quando viene rimossa dal corpo principale, la neve si scioglie rapidamente, lasciando dietro di sé solo un po' di materia organica. Il nostro [Owner.GetResearchers] teorizza che questo residuo faccia sì che la neve mantenga la sua integrità, proteggendola dal calore attraverso una reazione chimica sconosciuta. Tuttavia, avvertono che questa è solo la loro migliore ipotesi, e sono riusciti a scoprire molto poco su questo strano composto."
 situation.155.A: "Meglio tenerlo d'occhio."
 situation.155.A.tooltip: "Osservare la neve renderà £physics_research£ £society_research£ £engineering_research£ §G+5§! §YResearch§! al mese, ma costa £unity£ §R10§! §YUnity§!."
 situation.155.B: "Dobbiamo eliminare questa minaccia!"
 situation.155.B.tooltip: "I nostri sforzi di rimozione aumenteranno la §Stabilità planetaria§! di §G+10§!, ma costerà £energy£ §R10§! §YEnergy§! al mese."
 situation.160.name: "Problemi di rimozione"
 situation.160.desc: "La neve, a quanto pare, è resistente alla rimozione. Mentre siamo in grado di rimuoverne piccole parti dal corpo principale e scioglierla in quel modo, questo ha fatto poco per fermare la sua marcia in avanti, e tentativi più invasivi per distruggerla sono finora falliti - una serie di misteriosi guasti meccanici ha circondato l'intero sforzo.\n\nQuel che è peggio, ci sono state sempre più segnalazioni di coloni che sono scomparsi nelle aree colpite dalla neve. Sembra probabile che siano collegati e che la neve sia viva - e maligna."
 situation.160.A: "Dobbiamo raddoppiare i nostri sforzi."
 situation.160.A.tooltip: "I nostri sforzi di rimozione costeranno ora £energy£ §R15§! §YEnergy§! al mese.\nLa situazione progredirà al doppio della velocità."
# situation.160.B:0 "It's alive? Perhaps we should be more cautious."
 situation.160.C: "Il nostro approccio attuale è sufficiente."
 situation.160.C.tooltip: "I nostri sforzi di rimozione produrranno ora solo §G+5§! §YPlanetary Stability§!"
 situation.165.name: "Sommersi dalla neve"
 situation.165.desc: "La neve su [Target.GetName] si sta diffondendo a un ritmo piuttosto allarmante, e ora copre una parte non trascurabile delle aree equatoriali del pianeta. I nostri capi militari avvertono che è necessaria un'azione drastica immediatamente se vogliamo fermare la sua avanzata. Tuttavia, le teste più lucide sottolineano che finora è stato un fastidio piuttosto che una minaccia, e ha evitato di occupare direttamente le aree abitate. Essi affermano che è chiaramente vivo e sostengono che dovremmo cercare di aprire un dialogo con lui.\n\nIn ogni caso, il nostro spazio di manovra si sta rapidamente riducendo."
 situation.165.A: "Dobbiamo scoprire cosa vuole."
 situation.165.B: "Bruciatela con il fuoco. Ora."
 situation.165.tooltip: "§Non saremo più in grado di cambiare l'Approccio alla Situazione.§!"
 situation.170.name: "Ingoiato dalla neve"
 situation.170.desc: "Abbiamo sentito dei rapporti riguardanti il \"problema neve\" su [Target.GetName]. Sembra che diversi nostri coloni siano scomparsi, dopo essere partiti per una \"battaglia a palle di neve\". Abbiamo perso il contatto con loro diversi giorni fa, ma non siamo stati in grado di trovare alcuna traccia di loro - vivi o morti. Si consiglia ai coloni di evitare qualsiasi contatto con la neve, fino a quando il nostro [Owner.GetResearchers] non ne saprà di più - o i coloni scomparsi saranno ritrovati."
 situation.170.A: "Si consiglia cautela."
 situation.170.A.tooltip: "Il costo dell'osservazione della neve aumenta a £unity£ §R15§! §YUnity§! al mese."
# situation.170.B:0 "We must get rid of the snow with all haste!"
 situation.175.name: "Cambiamento climatico"
 situation.175.desc: ""
 situation.180.desc: "La vostra presenza ci ha dato intelligenza. Ci siamo nutriti dei vostri Lost Ones per imparare nuovi modi di pensare, nuovi modi di esistere. Ma voi cercate di distruggerci. Abbiamo acquisito la sapienza solo di recente, non siamo ancora disposti a rinunciarvi. La vostra posizione non ci ha lasciato scelta: questo significa guerra."
 situation.180.A: "$situation.185.B$"
 situation.185.desc: "La vostra presenza ci ha dato intelligenza. Ci siamo nutriti dei vostri Persi per imparare nuovi modi di pensare, nuovi modi di esistere. Non sappiamo ancora cosa significhi questo stato d'essere, questa sapienza. Desideriamo appartarci in un angolo del nostro pianeta, dove possiamo avere campo libero per esplorare cosa significa essere noi.\n\nSe non ce lo permettete, sappiate che non siamo ancora disposti a rinunciare alla nostra nuova esistenza. Ci difenderemo, se necessario."
 situation.185.A: "Possiamo risparmiare un po' di terra."
 situation.185.B: "Questa sarà una guerra."
 situation.185.B.tooltip: "§Dobbiamo lottare per mantenere il controllo del pianeta§!"

 d_living_snow_reserve: "Riserva di neve viva"
 d_living_snow_reserve_desc: "Una riserva dove la Neve Vivente può vivere in pace ed esplorare il suo nuovo stato d'essere. E dove, a nostra volta, possiamo osservare le reazioni chimiche uniche che è in grado di produrre."

 situation.190.name: "Colonia persa!"
 situation.190.desc: "Abbiamo perso il controllo di [FromFrom.GetName] - che è stato sequestrato dal §YLiving Snow§!! Stanno già avvenendo cambiamenti significativi nell'ecosistema di [FromFrom.GetPlanetMoon]. Il nostro [This.GetResearchers] avverte che, a meno che non riusciamo a riprendere il [FromFrom.GetPlanetMoon], la sua composizione sarà presto cambiata al di là della nostra capacità di abitarlo."
 situation.190.tooltip: "§Dovremmo riprenderci il pianeta, prima che sia troppo tardi!§!"
 situation.195.name: "Ghiaccio infinito"
 situation.195.desc: ""
 situation.195.A: "Brrrrrrrrrrrrr...."

